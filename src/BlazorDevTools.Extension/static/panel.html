<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blazor DevTools Panel</title>
    <style>
      :root {
        --panel-bg: #f3f4f6;
        --surface-bg: #ffffff;
        --surface-subtle-bg: #f8fafc;
        --surface-border: #e2e8f0;
        --tree-pane-min-width: 260px;
        --details-pane-min-width: 340px;
        --pane-splitter-width: 12px;
        --text-primary: #1f2937;
        --text-muted: #64748b;
        --text-subtle: #475569;
        --metric-label-gold: #b99a5e;
        --metric-good: #4f8f63;
        --metric-good-bg: #f4faf5;
        --metric-good-border: #cfe2d4;
        --metric-warning: #c98232;
        --metric-warning-bg: #fff8f1;
        --metric-warning-border: #ecd7bc;
        --metric-bad: #c86a6a;
        --metric-bad-bg: #fff5f5;
        --metric-bad-border: #efcece;
        --metric-neutral: #8791a3;
        --metric-neutral-bg: #f7f9fc;
        --metric-neutral-border: #dbe2ea;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Segoe UI, sans-serif;
        background: var(--panel-bg);
        color: var(--text-primary);
        overflow: hidden;
      }

      main {
        height: 100vh;
        box-sizing: border-box;
        padding: 16px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .status {
        margin: 0 0 12px;
        color: #4b5563;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
      }

      .inspect-toggle {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        background: #e2e8f0;
        color: #0f172a;
        cursor: pointer;
        font-weight: 600;
      }

      .inspect-toggle.is-active {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .tree-toolbar {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      .tree-filter {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        color: #0f172a;
        box-sizing: border-box;
      }

      .tree-filter:focus {
        outline: 2px solid #bfdbfe;
        border-color: #60a5fa;
      }

      .panel-layout {
        --tree-pane-width: 38%;
        display: grid;
        grid-template-columns:
          minmax(var(--tree-pane-min-width), var(--tree-pane-width))
          var(--pane-splitter-width)
          minmax(var(--details-pane-min-width), 1fr);
        gap: 0;
        min-height: 0;
        flex: 1;
      }

      .pane-splitter {
        position: relative;
        min-width: var(--pane-splitter-width);
        cursor: col-resize;
        touch-action: none;
        user-select: none;
      }

      .pane-splitter::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 50%;
        width: 1px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #cbd5e1;
        transition: background-color 120ms ease, box-shadow 120ms ease, width 120ms ease;
      }

      .pane-splitter::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 32px;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background-image: radial-gradient(circle, #94a3b8 1.1px, transparent 1.1px);
        background-size: 4px 8px;
        background-position: center;
        opacity: 0.85;
        pointer-events: none;
      }

      .pane-splitter:hover::before,
      .pane-splitter:focus-visible::before,
      .pane-splitter.is-active::before {
        width: 2px;
        background: #60a5fa;
        box-shadow: 0 0 0 3px rgba(191, 219, 254, 0.8);
      }

      .pane-splitter:focus-visible {
        outline: none;
      }

      .surface {
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .pane-header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
      }

      .pane-header h2 {
        margin: 0;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .tree-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        margin-right: 8px;
      }

      .tree-scroll {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }

      .empty-state {
        margin: 0;
        padding: 12px;
        color: #6b7280;
      }

      .tree-level {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-level .tree-level {
        margin-left: 18px;
        padding-left: 10px;
        border-left: 1px solid #e5e7eb;
      }

      .tree-item {
        margin: 4px 0;
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tree-toggle,
      .tree-node {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .tree-toggle {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        color: #475569;
      }

      .tree-toggle:hover,
      .tree-node:hover {
        background: #e5e7eb;
      }

      .tree-spacer {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
      }

      .tree-node {
        flex: 1;
        text-align: left;
        padding: 6px 10px;
        border-radius: 8px;
      }

      .tree-node.is-selected {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .tree-meta {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: #64748b;
      }

      .details-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        margin-left: 8px;
      }

      body.is-resizing-panes {
        cursor: col-resize;
        user-select: none;
      }

      .details-scroll {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      .details-shell {
        padding: 0 16px 16px;
      }

      .details-sticky {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 16px 0 12px;
        background: linear-gradient(to bottom, #ffffff 0%, #ffffff 85%, rgba(255,255,255,0.94) 100%);
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 16px;
      }

      .details-name {
        margin: 0;
        font-size: 20px;
      }

      .details-subtitle {
        margin: 6px 0 0;
        color: #64748b;
        font-size: 13px;
        word-break: break-word;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .summary-card {
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .summary-label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .summary-label--performance {
        color: var(--metric-label-gold);
      }

      .summary-value {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        word-break: break-word;
        font-variant-numeric: tabular-nums;
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .tab-button {
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #334155;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .tab-button.is-active {
        background: #dbeafe;
        border-color: #93c5fd;
        color: #1d4ed8;
      }

      .tab-panel {
        min-height: 0;
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
      }

      .overview-item {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .overview-label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .overview-value {
        margin: 0;
        font-size: 13px;
        word-break: break-word;
      }

      .detail-card {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .detail-value {
        margin: 0;
        font-size: 14px;
        word-break: break-word;
      }

      .parameters-section {
        margin-top: 16px;
      }

      .services-section {
        margin-top: 16px;
      }

      .cascading-section {
        margin-top: 16px;
      }

      .dependencies-section {
        margin-top: 16px;
        display: grid;
        gap: 16px;
      }

      .dependencies-section > .services-section,
      .dependencies-section > .cascading-section {
        margin-top: 0;
      }

      .dependencies-graph-section {
        margin-top: 16px;
      }

      .metrics-section {
        margin-top: 16px;
      }

      .render-info-section {
        margin-top: 16px;
      }

      .render-diff-section {
        margin-top: 16px;
      }

      .parameters-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .services-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .cascading-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .dependencies-graph-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .dependencies-graph-note,
      .dependencies-graph-hint {
        margin: 0 0 12px;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .dependency-graph-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .dependency-graph-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-subtle);
      }

      .dependency-graph-legend-swatch {
        width: 20px;
        height: 0;
        border-top-width: 3px;
        border-top-style: solid;
        border-radius: 999px;
        display: inline-block;
      }

      .dependency-graph-legend-swatch--ParentChild {
        border-top-color: #3b82f6;
      }

      .dependency-graph-legend-swatch--ParameterFlow {
        border-top-color: #16a34a;
        border-top-style: dashed;
      }

      .dependency-graph-legend-swatch--CascadingDependency {
        border-top-color: #7c3aed;
        border-top-style: dashed;
      }

      .dependency-graph-legend-swatch--exact {
        border-top-color: #0f172a;
      }

      .dependency-graph-legend-swatch--inferred {
        border-top-color: #64748b;
        border-top-style: dashed;
      }

      .dependency-graph-canvas {
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        overflow: hidden;
      }

      .dependency-graph-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 14px;
        border-bottom: 1px solid var(--surface-border);
        background: rgba(248, 250, 252, 0.88);
      }

      .dependency-graph-controls-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .dependency-graph-control-button {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #334155;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .dependency-graph-control-button:hover:not(:disabled) {
        background: #eff6ff;
        border-color: #93c5fd;
        color: #1d4ed8;
      }

      .dependency-graph-control-button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .dependency-graph-zoom-value {
        min-width: 56px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: #0f172a;
        font-variant-numeric: tabular-nums;
      }

      .dependency-graph-controls-hint,
      .dependency-graph-selection-summary {
        margin: 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      .dependency-graph-selection-summary {
        padding: 10px 14px 0;
        line-height: 1.5;
      }

      .dependency-graph-viewport {
        position: relative;
        min-height: 420px;
        max-height: 560px;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable both-edges;
        cursor: grab;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .graph-tab-panel .dependencies-graph-section {
        margin-top: 16px;
      }

      .graph-tab-panel .dependency-graph-canvas {
        display: flex;
        flex-direction: column;
      }

      .graph-tab-panel .dependency-graph-viewport {
        min-height: 520px;
        height: clamp(520px, 58vh, 720px);
        max-height: none;
      }

      .dependency-graph-viewport:focus {
        outline: 2px solid #93c5fd;
        outline-offset: -2px;
      }

      .dependency-graph-viewport.is-panning {
        cursor: grabbing;
      }

      .dependency-graph-stage {
        position: relative;
      }

      .dependency-graph-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .dependency-graph-edge {
        stroke-width: 3.5;
        opacity: 0.97;
      }

      .dependency-graph-edge.is-inferred {
        stroke-width: 2.75;
        opacity: 0.72;
      }

      .dependency-graph-edge--ParentChild {
        stroke: #3b82f6;
      }

      .dependency-graph-edge--ParameterFlow {
        stroke: #16a34a;
        stroke-dasharray: 8 7;
      }

      .dependency-graph-edge--CascadingDependency {
        stroke: #7c3aed;
        stroke-dasharray: 8 7;
      }

      .dependency-graph-edge-hit-area {
        fill: none;
        stroke: transparent;
        stroke-width: 14;
        cursor: help;
      }

      .dependency-graph-edge-label-group {
        cursor: help;
      }

      .dependency-graph-edge-label-bg {
        fill: rgba(255, 255, 255, 0.98);
        stroke: rgba(148, 163, 184, 0.55);
      }

      .dependency-graph-edge-label-bg.is-inferred {
        fill: rgba(248, 250, 252, 0.92);
      }

      .dependency-graph-edge-label-bg--ParentChild {
        stroke: rgba(59, 130, 246, 0.35);
      }

      .dependency-graph-edge-label-bg--ParameterFlow {
        stroke: rgba(22, 163, 74, 0.35);
      }

      .dependency-graph-edge-label-bg--CascadingDependency {
        stroke: rgba(124, 58, 237, 0.35);
      }

      .dependency-graph-edge-label {
        font-size: 12px;
        font-weight: 600;
        font-family: Segoe UI, sans-serif;
      }

      .dependency-graph-edge-label--ParentChild {
        fill: #1d4ed8;
      }

      .dependency-graph-edge-label--ParameterFlow {
        fill: #15803d;
      }

      .dependency-graph-edge-label--CascadingDependency {
        fill: #6d28d9;
      }

      .dependency-graph-node {
        cursor: pointer;
        outline: none;
      }

      .dependency-graph-node-rect {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 1.5;
        filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.08));
      }

      .dependency-graph-node.is-selected .dependency-graph-node-rect {
        fill: #dbeafe;
        stroke: #2563eb;
        stroke-width: 2;
      }

      .dependency-graph-node:hover .dependency-graph-node-rect,
      .dependency-graph-node:focus .dependency-graph-node-rect {
        stroke: #60a5fa;
        stroke-width: 2;
      }

      .dependency-graph-node-name,
      .dependency-graph-node-type {
        font-family: Segoe UI, sans-serif;
        pointer-events: none;
      }

      .dependency-graph-node-name {
        font-size: 14px;
        font-weight: 700;
        fill: #0f172a;
      }

      .dependency-graph-node-type {
        font-size: 12px;
        fill: #64748b;
      }

      .dependency-graph-tooltip {
        position: absolute;
        z-index: 2;
        max-width: 280px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.96);
        color: #f8fafc;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.28);
        pointer-events: none;
        will-change: left, top;
      }

      .dependency-graph-tooltip::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        background: rgba(15, 23, 42, 0.96);
        transform: rotate(45deg);
      }

      .dependency-graph-tooltip[data-horizontal-placement="right"][data-vertical-placement="above"]::after {
        left: 16px;
        bottom: -5px;
      }

      .dependency-graph-tooltip[data-horizontal-placement="left"][data-vertical-placement="above"]::after {
        right: 16px;
        bottom: -5px;
      }

      .dependency-graph-tooltip[data-horizontal-placement="right"][data-vertical-placement="below"]::after {
        left: 16px;
        top: -5px;
      }

      .dependency-graph-tooltip[data-horizontal-placement="left"][data-vertical-placement="below"]::after {
        right: 16px;
        top: -5px;
      }

      .dependency-graph-tooltip-content {
        display: grid;
        gap: 4px;
      }

      .dependency-graph-tooltip-title {
        font-size: 12px;
        line-height: 1.4;
      }

      .dependency-graph-tooltip-meta,
      .dependency-graph-tooltip-detail {
        font-size: 12px;
        line-height: 1.45;
        color: rgba(226, 232, 240, 0.95);
        word-break: break-word;
      }

      .metrics-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .render-info-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .render-diff-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .render-diff-note {
        margin: 0 0 12px;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .parameter-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .service-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .cascading-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .metrics-grid {
        display: grid;
        gap: 10px;
      }

      .render-cause-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .render-diff-list,
      .render-diff-history-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .parameter-item {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .service-item {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .cascading-item {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .metric-card {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .render-cause-item {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .render-diff-item,
      .render-diff-history-item {
        padding: 8px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      /* compact, scan-friendly diff rows */
      .render-diff-list .render-diff-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
      }

      .render-diff-name {
        flex: 0 0 180px;
        font-size: 12px;
        text-transform: uppercase;
        color: var(--metric-label-gold);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .render-diff-values {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 0;
        min-width: 0;
      }

      .render-diff-prev,
      .render-diff-current {
        background: transparent;
        border-radius: 6px;
        padding: 2px 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
        max-width: 45%;
      }

      .render-diff-arrow {
        color: var(--text-subtle);
        flex: 0 0 auto;
      }

      /* history summary as compact toggle */
      .render-diff-history-summary {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 6px 8px;
        cursor: pointer;
        font-weight: 600;
        color: #334155;
        border-radius: 8px;
      }

      .render-diff-history-summary:hover {
        background: #eef2ff;
      }

      .render-diff-history-summary.is-selected {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .render-diff-history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .render-diff-history-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .render-diff-history-toggle {
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #334155;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .render-diff-history-toggle:hover {
        background: #f8fafc;
      }

      .render-diff-filter-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
      }

      .render-diff-filter-toggle input {
        margin: 0;
        accent-color: #2563eb;
      }

      .render-diff-history-details {
        margin-top: 8px;
      }

      .render-diff-selected-details {
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .render-diff-selected-title,
      .render-diff-selected-subtitle {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .render-diff-selected-subtitle {
        margin-top: 12px;
      }

      .render-diff-selected-grid {
        margin-bottom: 10px;
      }

      .render-diff-selected-cause-details {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .parameter-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .service-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .cascading-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .metric-label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .metric-label--performance {
        color: var(--metric-label-gold);
      }

      .render-cause-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--metric-label-gold);
      }

      .render-diff-name,
      .render-diff-history-title {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--metric-label-gold);
      }

      .render-diff-history-summary {
        margin-bottom: 0;
        font-size: 13px;
        line-height: 1.45;
        letter-spacing: 0;
        text-transform: none;
        color: #334155;
        font-variant-numeric: tabular-nums;
      }

      .render-diff-history-sequence,
      .render-diff-history-cause,
      .render-diff-history-change-summary {
        color: #334155;
      }

      .render-diff-history-summary.is-selected .render-diff-history-sequence,
      .render-diff-history-summary.is-selected .render-diff-history-cause,
      .render-diff-history-summary.is-selected .render-diff-history-change-summary {
        color: #1d4ed8;
      }

      .render-diff-history-timestamp,
      .render-diff-history-separator {
        color: var(--text-muted);
      }

      .render-diff-history-summary.is-selected .render-diff-history-timestamp,
      .render-diff-history-summary.is-selected .render-diff-history-separator {
        color: #2563eb;
      }

      .render-diff-history-timestamp {
        font-variant-numeric: tabular-nums;
      }

      .parameter-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .service-type {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .cascading-type {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .metric-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .summary-card[data-severity="good"],
      .metric-card[data-severity="good"] {
        background: var(--metric-good-bg);
        border-color: var(--metric-good-border);
      }

      .summary-card[data-severity="warning"],
      .metric-card[data-severity="warning"] {
        background: var(--metric-warning-bg);
        border-color: var(--metric-warning-border);
      }

      .summary-card[data-severity="bad"],
      .metric-card[data-severity="bad"] {
        background: var(--metric-bad-bg);
        border-color: var(--metric-bad-border);
      }

      .summary-card[data-severity="neutral"],
      .metric-card[data-severity="neutral"] {
        background: var(--metric-neutral-bg);
        border-color: var(--metric-neutral-border);
      }

      .summary-value--good,
      .metric-value--good {
        color: var(--metric-good);
      }

      .summary-value--warning,
      .metric-value--warning {
        color: var(--metric-warning);
      }

      .summary-value--bad,
      .metric-value--bad {
        color: var(--metric-bad);
      }

      .summary-value--neutral,
      .metric-value--neutral,
      .render-cause-details {
        color: var(--metric-neutral);
      }

      .render-cause-details {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .render-diff-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
        color: var(--metric-neutral);
      }

      @media (max-width: 720px) {
        .panel-layout {
          grid-template-columns: 1fr;
        }

        .pane-splitter {
          display: none;
        }

        .tree-pane,
        .details-pane {
          margin: 0;
        }

        .summary-grid,
        .overview-grid,
        .details-grid {
          grid-template-columns: 1fr;
        }
      }

      code {
        margin: 0;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="toolbar">
        <p id="snapshot-status" class="status">Waiting for a component snapshot from the inspected Blazor app.</p>
        <button id="inspect-toggle" class="inspect-toggle" type="button">Pick From Page</button>
      </div>
      <div id="panel-layout" class="panel-layout">
        <section id="tree-pane" class="surface tree-pane">
          <header class="pane-header">
            <h2>Component Tree</h2>
          </header>
          <div class="tree-toolbar">
            <input id="tree-filter" class="tree-filter" type="search" placeholder="Search by component or type name">
          </div>
          <div id="tree-root" class="tree-scroll">
            <p class="empty-state">Click the export button in the sample app after opening this panel.</p>
          </div>
        </section>

        <div
          id="pane-splitter"
          class="pane-splitter"
          role="separator"
          aria-label="Resize component tree and selection panes"
          aria-orientation="vertical"
          tabindex="0"></div>

        <aside id="details-pane" class="surface details-pane">
          <header class="pane-header">
            <h2>Selection</h2>
          </header>
          <div id="details-root" class="details-scroll">
            <p class="empty-state">Select a component node to inspect its metadata.</p>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
