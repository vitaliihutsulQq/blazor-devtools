<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blazor DevTools Panel</title>
    <style>
      :root {
        --panel-bg: #f3f4f6;
        --surface-bg: #ffffff;
        --surface-subtle-bg: #f8fafc;
        --surface-border: #e2e8f0;
        --text-primary: #1f2937;
        --text-muted: #64748b;
        --text-subtle: #475569;
        --metric-label-gold: #b99a5e;
        --metric-good: #4f8f63;
        --metric-good-bg: #f4faf5;
        --metric-good-border: #cfe2d4;
        --metric-warning: #c98232;
        --metric-warning-bg: #fff8f1;
        --metric-warning-border: #ecd7bc;
        --metric-bad: #c86a6a;
        --metric-bad-bg: #fff5f5;
        --metric-bad-border: #efcece;
        --metric-neutral: #8791a3;
        --metric-neutral-bg: #f7f9fc;
        --metric-neutral-border: #dbe2ea;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Segoe UI, sans-serif;
        background: var(--panel-bg);
        color: var(--text-primary);
        overflow: hidden;
      }

      main {
        height: 100vh;
        box-sizing: border-box;
        padding: 16px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .status {
        margin: 0 0 12px;
        color: #4b5563;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
      }

      .inspect-toggle {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        background: #e2e8f0;
        color: #0f172a;
        cursor: pointer;
        font-weight: 600;
      }

      .inspect-toggle.is-active {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .tree-toolbar {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      .tree-filter {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        color: #0f172a;
        box-sizing: border-box;
      }

      .tree-filter:focus {
        outline: 2px solid #bfdbfe;
        border-color: #60a5fa;
      }

      .panel-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(240px, 0.9fr);
        gap: 16px;
        min-height: 0;
        flex: 1;
      }

      .surface {
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .pane-header {
        padding: 14px 16px;
        border-bottom: 1px solid #e5e7eb;
      }

      .pane-header h2 {
        margin: 0;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .tree-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .tree-scroll {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }

      .empty-state {
        margin: 0;
        padding: 12px;
        color: #6b7280;
      }

      .tree-level {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .tree-level .tree-level {
        margin-left: 18px;
        padding-left: 10px;
        border-left: 1px solid #e5e7eb;
      }

      .tree-item {
        margin: 4px 0;
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tree-toggle,
      .tree-node {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .tree-toggle {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        color: #475569;
      }

      .tree-toggle:hover,
      .tree-node:hover {
        background: #e5e7eb;
      }

      .tree-spacer {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
      }

      .tree-node {
        flex: 1;
        text-align: left;
        padding: 6px 10px;
        border-radius: 8px;
      }

      .tree-node.is-selected {
        background: #dbeafe;
        color: #1d4ed8;
      }

      .tree-meta {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: #64748b;
      }

      .details-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .details-scroll {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      .details-shell {
        padding: 0 16px 16px;
      }

      .details-sticky {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 16px 0 12px;
        background: linear-gradient(to bottom, #ffffff 0%, #ffffff 85%, rgba(255,255,255,0.94) 100%);
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 16px;
      }

      .details-name {
        margin: 0;
        font-size: 20px;
      }

      .details-subtitle {
        margin: 6px 0 0;
        color: #64748b;
        font-size: 13px;
        word-break: break-word;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .summary-card {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .summary-label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .summary-label--performance {
        color: var(--metric-label-gold);
      }

      .summary-value {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        word-break: break-word;
        font-variant-numeric: tabular-nums;
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .tab-button {
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #334155;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .tab-button.is-active {
        background: #dbeafe;
        border-color: #93c5fd;
        color: #1d4ed8;
      }

      .tab-panel {
        min-height: 0;
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
      }

      .overview-item {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .overview-label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .overview-value {
        margin: 0;
        font-size: 13px;
        word-break: break-word;
      }

      .detail-card {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .detail-value {
        margin: 0;
        font-size: 14px;
        word-break: break-word;
      }

      .parameters-section {
        margin-top: 16px;
      }

      .services-section {
        margin-top: 16px;
      }

      .cascading-section {
        margin-top: 16px;
      }

      .metrics-section {
        margin-top: 16px;
      }

      .render-info-section {
        margin-top: 16px;
      }

      .parameters-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .services-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .cascading-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .metrics-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .render-info-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #475569;
      }

      .parameter-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .service-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .cascading-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .metrics-grid {
        display: grid;
        gap: 10px;
      }

      .render-cause-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .parameter-item {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .service-item {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .cascading-item {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .metric-card {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .render-cause-item {
        padding: 12px;
        border-radius: 10px;
        background: var(--surface-subtle-bg);
        border: 1px solid var(--surface-border);
      }

      .parameter-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .service-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .cascading-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .metric-label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }

      .metric-label--performance {
        color: var(--metric-label-gold);
      }

      .render-cause-name {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--metric-label-gold);
      }

      .parameter-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .service-type {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .cascading-type {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      .metric-value {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .summary-card[data-severity="good"],
      .metric-card[data-severity="good"] {
        background: var(--metric-good-bg);
        border-color: var(--metric-good-border);
      }

      .summary-card[data-severity="warning"],
      .metric-card[data-severity="warning"] {
        background: var(--metric-warning-bg);
        border-color: var(--metric-warning-border);
      }

      .summary-card[data-severity="bad"],
      .metric-card[data-severity="bad"] {
        background: var(--metric-bad-bg);
        border-color: var(--metric-bad-border);
      }

      .summary-card[data-severity="neutral"],
      .metric-card[data-severity="neutral"] {
        background: var(--metric-neutral-bg);
        border-color: var(--metric-neutral-border);
      }

      .summary-value--good,
      .metric-value--good {
        color: var(--metric-good);
      }

      .summary-value--warning,
      .metric-value--warning {
        color: var(--metric-warning);
      }

      .summary-value--bad,
      .metric-value--bad {
        color: var(--metric-bad);
      }

      .summary-value--neutral,
      .metric-value--neutral,
      .render-cause-details {
        color: var(--metric-neutral);
      }

      .render-cause-details {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
      }

      @media (max-width: 720px) {
        .panel-layout {
          grid-template-columns: 1fr;
        }

        .summary-grid,
        .overview-grid,
        .details-grid {
          grid-template-columns: 1fr;
        }
      }

      code {
        margin: 0;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="toolbar">
        <p id="snapshot-status" class="status">Waiting for a component snapshot from the inspected Blazor app.</p>
        <button id="inspect-toggle" class="inspect-toggle" type="button">Pick From Page</button>
      </div>
      <div class="panel-layout">
        <section class="surface tree-pane">
          <header class="pane-header">
            <h2>Component Tree</h2>
          </header>
          <div class="tree-toolbar">
            <input id="tree-filter" class="tree-filter" type="search" placeholder="Search by component or type name">
          </div>
          <div id="tree-root" class="tree-scroll">
            <p class="empty-state">Click the export button in the sample app after opening this panel.</p>
          </div>
        </section>

        <aside class="surface details-pane">
          <header class="pane-header">
            <h2>Selection</h2>
          </header>
          <div id="details-root" class="details-scroll">
            <p class="empty-state">Select a component node to inspect its metadata.</p>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
