name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Authenticate to GitHub Packages
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source "https://nuget.pkg.github.com/vitaliihutsulQq/index.json" \
            --name github \
            --username "vitaliihutsulQq" \
            --password "${{ secrets.GH_PACKAGES_TOKEN }}" \
            --store-password-in-clear-text

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/BlazorDevTools.Extension/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore BlazorDevTools.sln

      - name: Build .NET solution
        run: dotnet build BlazorDevTools.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test BlazorDevTools.sln --configuration Release --no-build

      - name: Install extension dependencies
        working-directory: src/BlazorDevTools.Extension
        run: npm ci

      - name: Build extension
        working-directory: src/BlazorDevTools.Extension
        run: npm run build